<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finanças</title>
    
    <!-- Para instalar no celular como App -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons (Ícones modernos) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* Esconde a barra de rolagem mas mantém funcionando */
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animação do Modal (Bottom Sheet) */
        .modal-enter { transform: translateY(100%); transition: transform 0.3s ease-out; }
        .modal-active { transform: translateY(0); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-24">

    <!-- Header & Filtro -->
    <header class="pt-8 pb-4 px-6 bg-white shadow-sm sticky top-0 z-10 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold text-slate-800">Visão Geral</h1>
            <p class="text-sm text-slate-500">Seu controle financeiro</p>
        </div>
        <input type="month" id="mesFiltro" class="bg-slate-100 text-slate-700 font-medium py-2 px-3 rounded-xl border-none outline-none text-sm">
    </header>

    <!-- Dashboard Cards -->
    <main class="p-6 space-y-6">
        
        <!-- Card Principal (Saldo) -->
        <div class="bg-gradient-to-br from-blue-700 to-indigo-800 rounded-3xl p-6 text-white shadow-lg shadow-blue-900/20">
            <div class="flex justify-between items-center mb-4">
                <span class="text-blue-100 text-sm font-medium">Saldo do Mês</span>
                <i class="ph ph-wallet text-2xl text-blue-200"></i>
            </div>
            <h2 id="saldoTotal" class="text-4xl font-bold tracking-tight">R$ 0,00</h2>
        </div>

        <!-- Cards Menores (Receitas/Despesas) -->
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex items-center gap-4">
                <div class="bg-green-100 p-3 rounded-full text-green-600">
                    <i class="ph ph-trend-up text-xl"></i>
                </div>
                <div>
                    <p class="text-xs text-slate-500 font-medium uppercase">Receitas</p>
                    <p id="totalGanhos" class="text-sm font-bold text-slate-800">R$ 0,00</p>
                </div>
            </div>
            
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex items-center gap-4">
                <div class="bg-red-100 p-3 rounded-full text-red-600">
                    <i class="ph ph-trend-down text-xl"></i>
                </div>
                <div>
                    <p class="text-xs text-slate-500 font-medium uppercase">Despesas</p>
                    <p id="totalDespesas" class="text-sm font-bold text-slate-800">R$ 0,00</p>
                </div>
            </div>
        </div>

        <!-- Lista de Transações -->
        <div>
            <h3 class="text-lg font-bold text-slate-800 mb-4 mt-2">Extrato do Mês</h3>
            <div id="listaTransacoes" class="space-y-3">
                <!-- Javascript preenche aqui -->
            </div>
        </div>
    </main>

    <!-- Botão Flutuante (FAB) -->
    <button onclick="abrirModal()" class="fixed bottom-6 right-6 w-14 h-14 bg-blue-600 text-white rounded-full shadow-lg shadow-blue-600/40 flex items-center justify-center text-3xl hover:bg-blue-700 transition active:scale-95 z-20">
        <i class="ph ph-plus"></i>
    </button>

    <!-- Modal Adicionar Transação (Bottom Sheet) -->
    <div id="modalFundo" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 hidden transition-opacity" onclick="fecharModal()"></div>
    
    <div id="modalTransacao" class="fixed bottom-0 left-0 right-0 bg-white rounded-t-3xl p-6 z-50 modal-enter">
        <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6"></div>
        <h2 class="text-xl font-bold text-slate-800 mb-6">Nova Transação</h2>
        
        <form id="formTransacao" class="space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase">Tipo</label>
                    <select id="tipo" class="w-full bg-slate-100 border-none p-3 rounded-xl text-slate-700 font-medium outline-none" onchange="toggleParcelas()">
                        <option value="despesa">Despesa</option>
                        <option value="ganho">Receita</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase">Categoria</label>
                    <select id="categoria" class="w-full bg-slate-100 border-none p-3 rounded-xl text-slate-700 font-medium outline-none" onchange="toggleParcelas()">
                        <option value="variavel">Variável (Avulsa)</option>
                        <option value="fixo">Fixa (Mensal)</option>
                        <option value="cartao">Cartão de Crédito</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase">Descrição</label>
                <input type="text" id="descricao" required class="w-full bg-slate-100 border-none p-3 rounded-xl text-slate-700 font-medium outline-none" placeholder="Ex: Conta de Luz">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase">Valor Total (R$)</label>
                    <input type="number" step="0.01" id="valor" required class="w-full bg-slate-100 border-none p-3 rounded-xl text-slate-700 font-medium outline-none" placeholder="0.00">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase">Data</label>
                    <input type="date" id="data" required class="w-full bg-slate-100 border-none p-3 rounded-xl text-slate-700 font-medium outline-none">
                </div>
            </div>

            <div id="divParcelas" class="hidden">
                <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase">Qtd. Parcelas</label>
                <input type="number" id="parcelas" min="1" value="1" class="w-full bg-slate-100 border-none p-3 rounded-xl text-slate-700 font-medium outline-none">
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl mt-4 shadow-lg shadow-blue-600/30 active:scale-95 transition">
                Adicionar
            </button>
        </form>
    </div>

    <!-- Script Principal -->
    <script src="app.js"></script>
</body>
</html>
