<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Finanças</title>
    <!-- Tailwind CSS para estilização rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        <h1 class="text-3xl font-bold text-center text-blue-600">Minhas Finanças</h1>

        <!-- Filtro de Mês -->
        <div class="flex justify-center mb-6">
            <input type="month" id="mesFiltro" class="px-4 py-2 rounded shadow border border-gray-300">
        </div>

        <!-- Dashboard (Resumo) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-6 rounded-lg shadow border-l-4 border-green-500">
                <h3 class="text-gray-500 text-sm font-semibold uppercase">Ganhos no Mês</h3>
                <p id="totalGanhos" class="text-2xl font-bold text-green-600">R$ 0,00</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow border-l-4 border-red-500">
                <h3 class="text-gray-500 text-sm font-semibold uppercase">Despesas no Mês</h3>
                <p id="totalDespesas" class="text-2xl font-bold text-red-600">R$ 0,00</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow border-l-4 border-blue-500">
                <h3 class="text-gray-500 text-sm font-semibold uppercase">Saldo Restante</h3>
                <p id="saldoTotal" class="text-2xl font-bold text-blue-600">R$ 0,00</p>
            </div>
        </div>

        <!-- Formulário de Nova Transação -->
        <div class="bg-white p-6 rounded-lg shadow">
            <h2 class="text-xl font-bold mb-4">Nova Transação</h2>
            <form id="formTransacao" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <div>
                    <label class="block text-sm font-medium">Tipo</label>
                    <select id="tipo" class="w-full mt-1 p-2 border rounded" onchange="toggleParcelas()">
                        <option value="despesa">Despesa</option>
                        <option value="ganho">Ganho</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium">Categoria</label>
                    <select id="categoria" class="w-full mt-1 p-2 border rounded" onchange="toggleParcelas()">
                        <option value="variavel">Variável (Avulsa)</option>
                        <option value="fixo">Fixo (Mensal)</option>
                        <option value="cartao">Cartão de Crédito</option>
                    </select>
                </div>

                <div class="md:col-span-2">
                    <label class="block text-sm font-medium">Descrição</label>
                    <input type="text" id="descricao" required class="w-full mt-1 p-2 border rounded" placeholder="Ex: Conta de Luz, Salário, Compra na Shopee...">
                </div>

                <div>
                    <label class="block text-sm font-medium">Valor Total (R$)</label>
                    <input type="number" step="0.01" id="valor" required class="w-full mt-1 p-2 border rounded" placeholder="0.00">
                </div>

                <div>
                    <label class="block text-sm font-medium">Data (Primeiro vencimento ou recebimento)</label>
                    <input type="date" id="data" required class="w-full mt-1 p-2 border rounded">
                </div>

                <div id="divParcelas" class="hidden md:col-span-2">
                    <label class="block text-sm font-medium">Quantidade de Parcelas</label>
                    <input type="number" id="parcelas" min="1" value="1" class="w-full mt-1 p-2 border rounded" placeholder="Ex: 3">
                    <p class="text-xs text-gray-500 mt-1">O valor total será dividido igualmente entre os meses seguintes.</p>
                </div>

                <div class="md:col-span-2">
                    <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition">
                        Salvar Transação
                    </button>
                </div>
            </form>
        </div>

        <!-- Lista de Transações do Mês -->
        <div class="bg-white p-6 rounded-lg shadow overflow-x-auto">
            <h2 class="text-xl font-bold mb-4">Extrato do Mês</h2>
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-100 text-gray-600 text-sm uppercase">
                        <th class="p-3 border-b">Data</th>
                        <th class="p-3 border-b">Descrição</th>
                        <th class="p-3 border-b">Categoria</th>
                        <th class="p-3 border-b">Valor</th>
                        <th class="p-3 border-b text-center">Ação</th>
                    </tr>
                </thead>
                <tbody id="tabelaTransacoes">
                    <!-- Javascript vai preencher aqui -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // === COLAR SUAS CHAVES DO SUPABASE AQUI ===
        const supabaseUrl = 'https://txmqbndqrcjglnavqtfk.supabase.co/rest/v1/';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4bXFibmRxcmNqZ2xuYXZxdGZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4OTQ5MjMsImV4cCI6MjEwNjQ3MDkyM30.PWRQA7SVF811wC7KW1AcTTp6l98WQictczF8XO3CDDE';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // Lógica de interface (esconder/mostrar parcelas)
        function toggleParcelas() {
            const tipo = document.getElementById('tipo').value;
            const categoria = document.getElementById('categoria').value;
            const divParcelas = document.getElementById('divParcelas');
            
            if (tipo === 'despesa' && categoria === 'cartao') {
                divParcelas.classList.remove('hidden');
            } else {
                divParcelas.classList.add('hidden');
                document.getElementById('parcelas').value = 1;
            }
        }

        // Definir mês atual por padrão no filtro
        const hoje = new Date();
        const mesFiltro = document.getElementById('mesFiltro');
        mesFiltro.value = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, '0')}`;
        mesFiltro.addEventListener('change', carregarDados);

        // Formatar Moeda
        const formatarDinheiro = (valor) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valor);

        // Salvar Transação
        document.getElementById('formTransacao').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const tipo = document.getElementById('tipo').value;
            const categoria = document.getElementById('categoria').value;
            const descricao = document.getElementById('descricao').value;
            const valorTotal = parseFloat(document.getElementById('valor').value);
            const dataBase = document.getElementById('data').value;
            const parcelas = parseInt(document.getElementById('parcelas').value) || 1;

            const valorParcela = valorTotal / parcelas;
            const inserts = [];

            // Lógica mágica do parcelamento: cria uma linha no banco pra cada mês
            for (let i = 0; i < parcelas; i++) {
                let dataNova = new Date(dataBase);
                dataNova.setMonth(dataNova.getMonth() + i);
                
                inserts.push({
                    tipo: tipo,
                    categoria: categoria,
                    descricao: parcelas > 1 ? `${descricao} (${i + 1}/${parcelas})` : descricao,
                    valor: valorParcela,
                    data: dataNova.toISOString().split('T')[0]
                });
            }

            // Enviar pro Supabase
            const { error } = await supabase.from('transacoes').insert(inserts);

            if (error) {
                alert('Erro ao salvar: ' + error.message);
            } else {
                document.getElementById('formTransacao').reset();
                toggleParcelas();
                carregarDados();
                alert('Salvo com sucesso!');
            }
        });

        // Carregar e Exibir Dados do Mês Selecionado
        async function carregarDados() {
            const [ano, mes] = mesFiltro.value.split('-');
            // Primeiro e último dia do mês
            const dataInicio = `${ano}-${mes}-01`;
            const dataFim = new Date(ano, mes, 0).toISOString().split('T')[0];

            const { data, error } = await supabase
                .from('transacoes')
                .select('*')
                .gte('data', dataInicio)
                .lte('data', dataFim)
                .order('data', { ascending: true });

            if (error) {
                console.error(error);
                return;
            }

            let totais = { ganho: 0, despesa: 0 };
            const tabela = document.getElementById('tabelaTransacoes');
            tabela.innerHTML = '';

            data.forEach(t => {
                totais[t.tipo] += parseFloat(t.valor);

                const tr = document.createElement('tr');
                tr.classList.add('border-b', 'hover:bg-gray-50');
                
                const corValor = t.tipo === 'ganho' ? 'text-green-600' : 'text-red-600';
                const sinal = t.tipo === 'ganho' ? '+' : '-';
                
                tr.innerHTML = `
                    <td class="p-3">${t.data.split('-').reverse().join('/')}</td>
                    <td class="p-3 font-medium">${t.descricao}</td>
                    <td class="p-3 capitalize">${t.categoria}</td>
                    <td class="p-3 font-bold ${corValor}">${sinal} ${formatarDinheiro(t.valor)}</td>
                    <td class="p-3 text-center">
                        <button onclick="deletarTransacao('${t.id}')" class="text-red-500 hover:text-red-700 font-bold">X</button>
                    </td>
                `;
                tabela.appendChild(tr);
            });

            // Atualizar Dashboard
            document.getElementById('totalGanhos').textContent = formatarDinheiro(totais.ganho);
            document.getElementById('totalDespesas').textContent = formatarDinheiro(totais.despesa);
            
            const saldo = totais.ganho - totais.despesa;
            const elSaldo = document.getElementById('saldoTotal');
            elSaldo.textContent = formatarDinheiro(saldo);
            elSaldo.className = `text-2xl font-bold ${saldo >= 0 ? 'text-blue-600' : 'text-red-600'}`;
        }

        // Deletar Transação
        window.deletarTransacao = async function(id) {
            if(confirm('Tem certeza que quer apagar essa transação?')) {
                await supabase.from('transacoes').delete().eq('id', id);
                carregarDados();
            }
        }

        // Iniciar
        carregarDados();
    </script>
</body>
</html>
